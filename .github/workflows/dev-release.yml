name: Dev prerelease
on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "scripts/**"
      - "genvex-flow-card-core.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dev-release.yml"
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build and smoke test standalone card
        run: npm run check
      - name: Read card version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^const CARD_VERSION="\([^"]*\)";/\1/p' src/ventilation-flow-card.js)
          test -n "$VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" dist/genvex-flow-card.js --target "${{ github.sha }}" --prerelease --title "$TAG" --generate-notes
