name: Dev prerelease

on:
  push:
    branches: [dev]
    paths:
      - "genvex-flow-card.js"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read card version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^const CARD_VERSION="\([^"]*\)";/\1/p' genvex-flow-card.js)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate prerelease version
        shell: bash
        run: |
          echo "${{ steps.version.outputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$'
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" genvex-flow-card.js \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "$TAG" \
            --generate-notes
