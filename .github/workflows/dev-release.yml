name: Dev prerelease
on:
  push:
    branches: [dev]
    paths:
      - "src/**"
      - "scripts/**"
      - "genvex-flow-card-core.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dev-release.yml"
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build and smoke test standalone card
        run: npm run check
      - name: Read card version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^const CARD_VERSION="\([^"]*\)";/\1/p' src/ventilation-flow-card.js)
          test -n "$VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish tested bundle to repository root
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          cp dist/genvex-flow-card.js genvex-flow-card.js
          node scripts/smoke-test.mjs genvex-flow-card.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add genvex-flow-card.js
          if git diff --cached --quiet; then
            echo "No bundle change"
          else
            git commit -m "Build v${{ steps.version.outputs.version }} HACS bundle"
            git push origin HEAD:dev
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify tagged HACS file and create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          TARGET="${{ steps.bundle.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "$TARGET"
          cmp -s genvex-flow-card.js dist/genvex-flow-card.js
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" genvex-flow-card.js --target "$TARGET" --prerelease --title "$TAG" --generate-notes
