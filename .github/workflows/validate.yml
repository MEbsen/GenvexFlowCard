name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required HACS files
        run: |
          test -f hacs.json
          test -f genvex-flow-card.js
          test -f genvex-flow-card-core.js
          test -f adapters.js
          test -f README.md
          node --check genvex-flow-card.js
          node --check genvex-flow-card-core.js
          node --check adapters.js
